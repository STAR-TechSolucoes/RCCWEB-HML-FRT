<div class="container py-5" *ngIf="evento">
  <div class="row justify-content-center">
    <div class="col-md-8">
      
      <div class="card shadow border-0 overflow-hidden" style="border-radius: 15px;">
        <!-- Banner -->
        <img [src]="evento.evtImagem" class="img-fluid" style="width: 100%; max-height: 400px; object-fit: cover;">
        
        <div class="card-body p-4">
          <h1 class="fw-bold mb-1">{{ evento.evtNome }}</h1>
          <p class="text-muted mb-4">{{ evento.evtCidade }}</p>

          <form (submit)="confirmarInscricao()">
            <h5 class="mb-3 border-bottom pb-2 text-primary fw-bold">Seus Dados</h5>
            
            <div class="row g-3">
              <!-- NOME usando seu app-campo-texto -->
              <div class="col-md-12">
                <app-campo-texto 
                  label="Nome Completo" 
                  [(value)]="ptcNome" 
                  [required]="true"
                  placeholder="Nome completo do participante">
                </app-campo-texto>
              </div>

              <!-- CPF usando seu app-campo-cpf -->
              <div class="col-md-6">
                <app-campo-cpf 
                  [(value)]="ptcCpf" 
                  [required]="true">
                </app-campo-cpf>
              </div>

              <!-- DATA NASCIMENTO usando seu app-campo-texto com type="date" -->
              <div class="col-md-6">
                <app-campo-texto 
                  label="Data de Nascimento" 
                  type="date" 
                  [(value)]="ptcDataNascimento" 
                  [required]="true">
                </app-campo-texto>
              </div>

              <!-- E-MAIL usando seu app-campo-texto -->
              <div class="col-md-12 mb-3">
                <app-campo-texto 
                  label="E-mail" 
                  type="email" 
                  [(value)]="ptcEmail" 
                  [required]="true"
                  placeholder="Ex: joao@email.com">
                </app-campo-texto>
              </div>
            </div>

            <!-- PERGUNTAS DINÂMICAS (LOW-CODE) -->
            <div *ngIf="evento.camposCustomizados?.length > 0">
              <h5 class="mb-3 border-bottom pb-2 mt-4 text-primary fw-bold">Informações Adicionais</h5>
              
              <div *ngFor="let campo of evento.camposCustomizados" class="mb-3">
                
                <!-- Se for texto ou número, usa seu app-campo-texto -->
                <app-campo-texto 
                  *ngIf="campo.tipo === 'text' || campo.tipo === 'number'"
                  [label]="campo.label"
                  [type]="campo.tipo"
                  [(value)]="respostasDinamicas[campo.label]"
                  [required]="campo.obrigatorio">
                </app-campo-texto>

                <!-- Se for seleção, mantemos o select padrão (ou use um componente de select se tiver) -->
                <div *ngIf="campo.tipo === 'select'">
                  <label class="form-label">{{ campo.label }} <span *ngIf="campo.obrigatorio" class="text-danger">*</span></label>
                  <select class="form-select" 
                          [(ngModel)]="respostasDinamicas[campo.label]" 
                          [name]="campo.label" 
                          [required]="campo.obrigatorio">
                    <option value="">Selecione...</option>
                    <option *ngFor="let opt of campo.opcoes" [value]="opt">{{ opt }}</option>
                  </select>
                </div>

              </div>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 mt-4 shadow-sm fw-bold">
              CONCLUIR INSCRIÇÃO
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
